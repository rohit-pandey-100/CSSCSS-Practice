<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        img {
            width: 200px;
            height: 200px;
            border-radius: 20px 30px;
        }

        .i1 {
            corner-shape: round;
        }

        .i2 {
            corner-shape: bevel;
        }

        .i3 {
            corner-shape: notch;
        }

        .i4 {
            corner-shape: squircle;
        }

        .i5 {
            corner-shape: superellipse(0.4);
        }

        .i6 {
            corner-shape: round bevel;
        }

        img:hover {
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <h2>demo on multiple selecotrs</h2>
    <img src="e:/images/a.jpg" class="i1">
    <img src="e:/images/b.jpeg" class="i2">
    <img src="e:/images/c.png" class="i3">
    <img src="e:/images/d.jpg" class="i4">
    <img src="e:/images/e.jpg" class="i5">
    <img src="e:/images/e.jpg" class="i6">

</body>

</html>
