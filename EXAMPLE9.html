<!--
id selector
=>this selector used to defined styles/to apply  styles for specific element (only 1 ele).
=>It is same as the inline styles.
    Syn:
		#ID{
		  property:value;
		  ...
		}

mapping:
=>using "id" attribute we have to map "id selector to element.
    <tag  id="ID" ...>
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <title>CSS</title>
    <meta charset="UTF-8">
    <link rel="icon" href="/img/logo1.avif">

    <style>
        #i1 {
            box-shadow: -4px 4px yellow;
        }

        #i2 {
            box-shadow: 0 -16px orange;
        }

        #i3 {
            box-shadow: 0 0 15px 3px black;
            /* box-shadow:inset 0 0 15px 3px black; */
        }

        div {
            width: 200px;
            height: 200px;
            background: cyan;
        }

        #i4 {
            box-shadow: 10px 10px red, 15px 15px blue, 20px 20px green;
        }

        #h {
            text-shadow: 0 0 3px orange;
        }
    </style>

</head>

<body>
    <h2>demo on id selector</h2>
    <div id="i1"></div>
    <br> <br>
    <div id="i2"></div>
    <br> <br>
    <div id="i3"></div>

    <p id="i1">hello</p> <!-- invalid -->
    <span id="i2 i3">welcome</span> <!-- invalid -->
    <br> <br> <br>

    <img src="img/img2.webp" id="i4">

    <h1 id="h">Rohit</h1>

</body>

</html>
