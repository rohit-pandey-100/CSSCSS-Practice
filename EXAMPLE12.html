<!--
attribute selector
=>this selector used to defined styles/to apply  common styles for group elements based on specified attribute.
    Syn:
		[attribute] /* Or [attribute=val] Or sel[attribute] Or sel[attribute=val] */
		{
		   property:value;
		   ...
		}
-->

<!DOCTYPE html>
<html lang="en">

<head>
  <title>CSS</title>

  <style>
    /*[type="text"] {

    [type="password"] {

      letter-spacing: 15px;
      word-spacing: 20px;
    }*/

    /* Or
	  [align]{ ... }
		Or
	  h2[align]{ ... }
		Or
	  h2[align="center"]{ ... }
		Or
	  #i[align="center"]{ ... }	  
		Or
	  .c[align="center"]{ ... }	  	  
		Or
	  div h2[align="center"]{ ... }	  	  
	  */
    h2[align="center"] {
      color: blue;
      font-size: 30px;
      text-align: center;
    }

    [type="text"] {
      color: blue;
    }

    [type="password"] {
      color: hotpink;
    }

    [align="center"] {
      letter-spacing: 15px;
      word-spacing: 20px;
    }
  </style>

</head>
