<!--
group selector
=>A group of selectors is called group selector 
=>this selector used to define the common properties for other selectors.
=>The purpose of group selectors to avoid code redundancy in other selectors.
	Syn:
		sel1,sel2,sel3...{
		   property:value;
		   ...
		}
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <title>CSS</title>
    <meta charset="UTF-8">
    <link rel="icon" href="/img/logo1.avif">
    <style>
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            background: rgb(60, 160, 160);
            color: rgb(200, 200, 200);
            width: 30%;
            text-align: center;
        }

        /*
	  #i1,#i2,#i3{ ... }
	  .c1,.c2,.c3{ ... }
	  div,#i,.c{ ... }	*/
    </style>

</head>

<body>
    <h2>demo on group selector</h2>
    <h1>HTML</h1>
    <h2>CSS</h2>
    <h3>Javascript</h3>
    <h4>Bootstrap</h4>
    <h5>React</h5>
    <h6>Node</h6>
    <h3>PHP</h3>
    <h1>Ajax</h1>
    <h2>JQuery</h2>

</body>

</html>
