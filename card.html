<!-- HTML with CSS implementations -->
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Card</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="card.css">
</head>

<body>
    <!-- <h1>Card Style designing</h1> -->

    <!-- container -->
    <div class="card">
        <!-- content -->
        <img src="images/shoe.jpg" alt="Skechers">

        <h2>Skechers Women Shoes</h2>

        <div class="rating">
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-regular fa-star"></i>
        </div>

        <span class="">4.0 (500 Reviews)</span>

        <h3>&#8377;3000</h3>

        <span>MRP: <del>&#8377;4000</del></span>

        <div>Get it by <strong>Thursday, August 6</strong></div>
    </div>

</body>

</html>
